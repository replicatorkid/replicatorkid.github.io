<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunt Start</title>

<style>
    body {
        font-family: sans-serif;
        text-align: center;
        padding: 40px 20px;
        background: white;
    }

    input {
        font-size: 20px;
        padding: 10px;
        width: 80%;
        max-width: 350px;
        text-align: center;
    }

    button {
        display: block;
        margin: 25px auto;
        padding: 15px 40px;
        font-size: 20px;
    }

    #status {
        margin-top: 20px;
    }
</style>
</head>

<body>

<div id="startScreen">

    <h1>Treasure Hunt</h1>

    <p>Enter your team name:</p>

    <input id="teamName" type="text" autocomplete="off">

    <button onclick="startHunt()">START</button>

    <div id="status"></div>

</div>

<script>

const RRRING_URL = "https://rrring.cloud/w/6zTxS3hLrBC4IjvNo4Nhe5xBtlMucmDeMvr9Xm4w";

const CLUE_NAME = "RRRing Test";

async function startHunt() {

    const team = document.getElementById("teamName").value.trim();
    const status = document.getElementById("status");

    if (!team) {
        status.textContent = "Please enter your team name.";
        return;
    }

    status.textContent = "Starting...";

    try {

        const response = await fetch(RRRING_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: "TREASURE HUNT",
                body: `${team} started ${CLUE_NAME}`,
                url: window.location.href
            })
        });

        if (!response.ok) {
            throw new Error("rrring returned " + response.status);
        }

        status.textContent = "Started!";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Notification failed, but continuing...";

    }

    // This is where your real clue would begin.
    // For this test, just replace the screen.

    document.getElementById("startScreen").innerHTML = `
        <h1>You're In!</h1>
        <p>Team: ${team}</p>
        <p>This is where the clue begins.</p>
    `;
}

</script>

</body>
</html>
