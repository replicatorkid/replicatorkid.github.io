<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compass Test</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    background:white;
    overflow:hidden;
    font-family:sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

/* START OVERLAY */
#overlay{
    position:fixed;
    inset:0;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
}

#startButton{
    font-size:22px;
    padding:16px 28px;
    border:2px solid black;
    background:white;
}

/* LAYOUT */
.half{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

svg{
    width:65vmin;
    height:65vmin;
    max-width:420px;
    max-height:420px;
}

/* DISTANCE READOUT */
#distanceReadout{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:24px;
    font-weight:bold;
    background:rgba(0, 0, 0, 0.1);
    padding:12px 24px;
    border-radius:8px;
    text-align:center;
    min-width:200px;
}
</style>
</head>

<body>

<div id="overlay">
    <button id="startButton">Tap to Start</button>
</div>

<div class="half">

<svg viewBox="0 0 200 200">

    <circle cx="100" cy="100" r="90"
            fill="white"
            stroke="black"
            stroke-width="2"/>

    <g id="needle1">
        <polygon points="100,34 106,100 100,94 94,100"
                 fill="black"/>
        <circle cx="100" cy="100" r="4" fill="black"/>
    </g>

</svg>

</div>

<div class="half">

<svg viewBox="0 0 200 200">

    <circle cx="100" cy="100" r="90"
            fill="white"
            stroke="black"
            stroke-width="2"/>

    <g id="needle2">
        <polygon points="100,34 106,100 100,94 94,100"
                 fill="black"/>
        <circle cx="100" cy="100" r="4" fill="black"/>
    </g>

</svg>

</div>

<div id="distanceReadout">
    --
</div>

<script src="sensor.js"></script>
<script>

/* ===== TARGET COORDINATE ===== */
const targetCoordinate = {
    lat: 37.7749,
    lon: -122.4194
};

let northAngle = 0;
let targetAngle = 0;

const needle1 = document.getElementById("needle1");
const needle2 = document.getElementById("needle2");

const overlay = document.getElementById("overlay");
const startButton = document.getElementById("startButton");
const distanceReadout = document.getElementById("distanceReadout");

/* ===== SENSOR STATE ===== */
let displayHeading = 0;

/* ===== HAVERSINE DISTANCE CALCULATION ===== */
function haversineDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Earth radius in km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c; // distance in km
}

/* ===== BEARING CALCULATION ===== */
function bearingToTarget(lat1, lon1, lat2, lon2) {
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
    const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
              Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
    let bearing = Math.atan2(y, x) * 180 / Math.PI;
    bearing = (bearing + 360) % 360; // normalize to 0..360
    return bearing;
}

/* ===== START ===== */
startButton.addEventListener("click", async () => {
    try {
        await Sensors.start();
    } catch (e) {
        console.error("Sensors setup failed:", e);
    }

    overlay.style.display = "none";
    animate();
});

function updateHeading(){
    // Get the current heading from Sensors
    const rawHeading = Sensors.orientation.heading ?? 0;

    // Difference between desired and displayed heading
    let delta = rawHeading - displayHeading;

    // Wrap into the range [-180, 180]
    delta = ((delta + 540) % 360) - 180;

    // Move 8% of the remaining distance each frame
    displayHeading += delta * 0.04;

    // Keep value in [0,360)
    displayHeading = (displayHeading + 360) % 360;
}

function updateTargetBearing(){
    // Get current GPS position
    const currentLat = Sensors.gps.lat;
    const currentLon = Sensors.gps.lon;

    // If we don't have GPS fix yet, skip
    if (currentLat == null || currentLon == null) {
        return;
    }

    // Calculate bearing to target
    const bearing = bearingToTarget(currentLat, currentLon, targetCoordinate.lat, targetCoordinate.lon);

    // Adjust for current heading (bearing is relative to north, we need it relative to device)
    targetAngle = bearing - displayHeading;

    // Calculate and display distance
    const distance = haversineDistance(currentLat, currentLon, targetCoordinate.lat, targetCoordinate.lon);
    
    if (distance < 1) {
        // Less than 1 km: show in meters
        distanceReadout.textContent = Math.round(distance * 1000) + " m";
    } else {
        // 1 km or more: show in km with 2 decimals
        distanceReadout.textContent = distance.toFixed(2) + " km";
    }
}

/* ===== ANIMATION LOOP ===== */
function animate(){

    /* TOP COMPASS = REAL HEADING */
    updateHeading();
    
    northAngle = -displayHeading;

    /* BOTTOM COMPASS = BEARING TO TARGET */
    updateTargetBearing();

    needle1.setAttribute(
        "transform",
        `rotate(${northAngle} 100 100)`
    );

    needle2.setAttribute(
        "transform",
        `rotate(${targetAngle} 100 100)`
    );

    requestAnimationFrame(animate);
}

</script>

</body>
</html>
