<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ring Visualizer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Using CDN links without integrity to avoid blocking due to hash mismatch -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,Arial}
    #map{position:fixed;left:340px;top:0;right:0;bottom:0; z-index:0}
    #panel{
      position:fixed;left:0;top:0;bottom:0;width:340px;padding:12px;
      box-sizing:border-box;background:#f7f7f7;border-right:1px solid #ddd;
      overflow:auto; z-index:1000; /* make sure controls are on top */
    }
    textarea{width:100%;height:220px;box-sizing:border-box;font-family:monospace}
    input[type="text"]{width:100%;box-sizing:border-box}
    label{font-weight:600;font-size:13px;display:block;margin-top:10px}
    button{margin-top:8px;padding:8px 12px}
    .hint{color:#555;font-size:13px;margin-top:6px}
    .footer{margin-top:12px;font-size:12px;color:#666}
  </style>
</head>
<body>
  <div id="panel">
    <h3>Ring Visualizer</h3>
    <div class="hint">Enter points (one per line). Supported formats:<br>
      - CSV: name,lat,lon  OR lat,lon,name<br>
      - JSON: an array of {"name","lat","lon"}</div>

    <label for="points">Points (example prefilled)</label>
    <textarea id="points">
McDonalds,43.7467722,-87.9553970
City Hall,43.774,-87.742
Bus Stop,43.760,-87.950
    </textarea>

    <label for="radii">Radii (meters, comma-separated)</label>
    <input id="radii" type="text" value="200,1000,1800,2600,3400,4200,5000" />

    <div style="margin-top:8px">
      <button id="draw" type="button">Draw</button>
      <button id="clear" type="button">Clear</button>
      <button id="fit" type="button">Fit Bounds</button>
    </div>

    <div class="hint">Click anywhere on the map to add a point (appends to the textarea).</div>
    <div class="footer">Rings are drawn as Leaflet circles (meters). Colors vary per radius.</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
  // Ensure DOM is ready before running initialization
  document.addEventListener('DOMContentLoaded', function () {
    // Initialize map
    const map = L.map('map').setView([43.76, -87.95], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    // UI elements
    const taPoints = document.getElementById('points');
    const inpRadii = document.getElementById('radii');
    const btnDraw = document.getElementById('draw');
    const btnClear = document.getElementById('clear');
    const btnFit = document.getElementById('fit');

    // Layer group to hold markers and circles
    const group = L.featureGroup().addTo(map);

    // Utility: parse points from textarea
    function parsePoints(text) {
      text = text.trim();
      if (!text) return [];
      // try JSON first
      try {
        const maybe = JSON.parse(text);
        if (Array.isArray(maybe)) {
          return maybe.map(p => {
            return {
              name: p.name || p.label || p.title || '',
              lat: parseFloat(p.lat),
              lon: parseFloat(p.lon)
            };
          }).filter(p => isFinite(p.lat) && isFinite(p.lon));
        }
      } catch (e) {
        // not JSON, continue to CSV/lines
      }
      const lines = text.split('\n').map(l => l.trim()).filter(l => l);
      const out = [];
      for (const l of lines) {
        const parts = l.split(',').map(p => p.trim());
        if (parts.length >= 2) {
          if (!isNaN(parts[0]) && !isNaN(parts[1])) {
            out.push({ name: parts.slice(2).join(',') || '', lat: parseFloat(parts[0]), lon: parseFloat(parts[1]) });
          } else if (!isNaN(parts[1]) && !isNaN(parts[2])) {
            out.push({ name: parts[0] || '', lat: parseFloat(parts[1]), lon: parseFloat(parts[2]) });
          } else {
            const ws = l.split(/\s+/);
            if (ws.length >= 2 && !isNaN(ws[0]) && !isNaN(ws[1])) {
              out.push({ name: ws.slice(2).join(' ') || '', lat: parseFloat(ws[0]), lon: parseFloat(ws[1]) });
            }
          }
        }
      }
      return out;
    }

    function parseRadii(text) {
      return text.split(',').map(s => parseFloat(s.trim())).filter(n => isFinite(n) && n >= 0).sort((a,b)=>a-b);
    }

    // color generator: hue by index
    function colorForIndex(i, total) {
      const hue = Math.round((i/Math.max(1,total))*240); // 0..240
      return `hsl(${hue}deg 80% 40%)`;
    }

    // Draw function
    function draw() {
      try {
        group.clearLayers();
        const pts = parsePoints(taPoints.value);
        const radii = parseRadii(inpRadii.value);
        if (pts.length === 0) {
          alert('No valid points parsed. See input format in the left panel.');
          return;
        }
        if (radii.length === 0) {
          alert('No valid radii parsed.');
          return;
        }

        const boundsArr = [];
        pts.forEach((p, pi) => {
          const mk = L.circleMarker([p.lat, p.lon], {radius:6,fill:true,fillColor:'#111',color:'#fff',weight:1}).bindPopup(`<b>${p.name||'Point'}</b><br>${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}`);
          mk.addTo(group);

          radii.forEach((r, ri) => {
            const color = colorForIndex(ri, radii.length);
            const circle = L.circle([p.lat, p.lon], {
              radius: r,
              color: color,
              weight: 1,
              fill: ri === 0,
              fillOpacity: 0.06
            }).addTo(group);
            if (ri === radii.length - 1) {
              circle.bindTooltip(`${r} m`, {permanent: false});
            }
            boundsArr.push(circle.getBounds());
          });
        });

        if (boundsArr.length) {
          const combined = boundsArr.reduce((acc, b) => acc? acc.extend(b) : L.latLngBounds(b), null);
          if (combined && combined.isValid()) {
            map.fitBounds(combined.pad(0.2));
          }
        }
      } catch (err) {
        // Report any runtime error to the console and alert user
        console.error('Draw error', err);
        alert('An error occurred while drawing. See console for details.');
      }
    }

    function clearAll() {
      group.clearLayers();
    }

    btnDraw.addEventListener('click', draw);
    btnClear.addEventListener('click', clearAll);
    btnFit.addEventListener('click', () => {
      if (group.getLayers().length) map.fitBounds(group.getBounds().pad(0.2));
    });

    // Clicking map appends a lat,lon line to the textarea and draws immediately
    map.on('click', function(e) {
      const lat = e.latlng.lat.toFixed(6);
      const lon = e.latlng.lng.toFixed(6);
      taPoints.value = (taPoints.value.trim() ? taPoints.value.trim() + '\n' : '') + `${lat},${lon},MapClick`;
      draw();
    });

    // initial draw
    draw();
  });
  </script>
</body>
</html>
