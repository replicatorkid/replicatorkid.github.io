<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directions</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: white;
        font-family: Arial, sans-serif;
    }

    #wordColumn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px; /* Vertical spacing between lines */
    }

    .word {
        font-size: 24px;
        text-align: center;
    }
</style>
</head>
<body>

<div class="word" id="unscrambled-hint" style="font-size:clamp(16px,5.5vw,28px);line-height:1.05;text-align:center;margin-bottom:12px;">
  If only this page came with
  <span style="font-weight:700; margin-left:6px; display:inline-block;">directions</span>
  <span aria-hidden="true" style="display:inline-block; margin-left:8px; font-size:0.9em; opacity:0.92;">directions . . .</span>
  <span aria-hidden="true" style="display:inline-block; margin-left:6px; font-size:0.75em; opacity:0.78;">directions . .</span>
  <span aria-hidden="true" style="display:inline-block; margin-left:6px; font-size:0.60em; opacity:0.64;">directions .</span>
</div>

<div id="wordColumn"></div>

<script>
const words = [
    "South on Krumrey St",
    "East on Suhrke Rd",
    "North on State 67",
    "East on State 23",
    "North on Hillside Rd",
    "Dassow Park",
    "Burrow"
];

const container = document.getElementById("wordColumn");

words.forEach(text => {

    // Remove whitespaces
    text = text.replace(/\s+/g, "");
    
    // Scramble the letters of this word
    let chars = text.split("");

    for (let i = chars.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [chars[i], chars[j]] = [chars[j], chars[i]];
    }

    const scrambled = chars.join("");

    const div = document.createElement("div");
    div.className = "word";
    div.textContent = scrambled;
    container.appendChild(div);
});
</script>

</body>
</html>
