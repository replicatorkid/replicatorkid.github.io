<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Compass Prototype</title>

<style>
body{
    font-family:sans-serif;
    max-width:700px;
    margin:auto;
    padding:2em;
}

button{
    font-size:1.2em;
    padding:.8em 1.4em;
}

pre{
    background:#eee;
    padding:1em;
}
</style>
</head>

<body>

<h2>Audio Compass Prototype</h2>

<button id="startButton">
Start GPS Audio
</button>

<pre id="status">
Waiting...
</pre>

<!-- include the sensor helper (provides global Sensors) -->
<script src="/sensor.js"></script>

<script>

let audioContext;

let sineOsc;
let squareOsc;

let sineGain;
let squareGain;
let masterGain;

let sensorPollId = null;
let geoWatchId = null;

const status = document.getElementById("status");

document.getElementById("startButton").onclick = async ()=>{

    //----------------------------------------
    // Audio
    //----------------------------------------

    // Create an AudioContext (user gesture already happened on click)
    audioContext = new AudioContext();

    sineOsc = audioContext.createOscillator();
    squareOsc = audioContext.createOscillator();

    sineGain = audioContext.createGain();
    squareGain = audioContext.createGain();
    masterGain = audioContext.createGain();

    sineOsc.type="sine";
    squareOsc.type="square";

    sineOsc.frequency.value=440;
    squareOsc.frequency.value=440;

    // start silent, will ramp to values on sensor updates
    sineGain.gain.value=1;
    squareGain.gain.value=0;
    masterGain.gain.value=0;

    sineOsc.connect(sineGain);
    squareOsc.connect(squareGain);

    sineGain.connect(masterGain);
    squareGain.connect(masterGain);

    masterGain.connect(audioContext.destination);

    sineOsc.start();
    squareOsc.start();

    //----------------------------------------
    // Sensors: prefer Sensors (sensor.js), fallback to navigator.geolocation
    //----------------------------------------

    // Try to start Sensors if available
    const useSensors = typeof window.Sensors !== 'undefined' && window.Sensors != null;

    if (useSensors) {
        try {
            // Sensors.start() asks for any needed permissions and begins smoothing/updating
            await window.Sensors.start();
            startPollingSensors();
            return;
        } catch (e) {
            // If Sensors.start fails, fall through to geolocation fallback
            console.warn("Sensors.start() failed:", e);
        }
    }

    // Fallback to navigator.geolocation.watchPosition
    if (navigator.geolocation && typeof navigator.geolocation.watchPosition === 'function') {
        geoWatchId = navigator.geolocation.watchPosition(
            gpsSuccess,
            gpsError,
            {
                enableHighAccuracy:true,
                maximumAge:0,
                timeout:5000
            }
        );
        return;
    }

    status.textContent = "No sensor or geolocation provider available.";
};

function startPollingSensors(){
    // Clear any existing poller
    if (sensorPollId) {
        clearInterval(sensorPollId);
        sensorPollId = null;
    }

    const rate = (window.Sensors && window.Sensors.updateRate) ? window.Sensors.updateRate : 30;
    const intervalMs = Math.max(50, Math.round(1000 / rate)); // clamp min interval

    sensorPollId = setInterval(()=>{
        const g = window.Sensors && window.Sensors.gps ? window.Sensors.gps : null;
        if (!g) {
            status.textContent = "Waiting for sensor GPS data...";
            return;
        }

        // sensor.js stores lat/lon as lat/lon, heading in degrees, speed in m/s
        const pos = {
            coords: {
                latitude: (g.lat != null ? g.lat : null),
                longitude: (g.lon != null ? g.lon : null),
                speed: (g.speed != null ? g.speed : null),
                heading: (g.heading != null ? g.heading : null)
            },
            timestamp: g.timestamp || Date.now()
        };

        // If there's no lat/lon yet, show waiting message
        if (pos.coords.latitude == null || pos.coords.longitude == null) {
            status.textContent = "Waiting for GPS fix...";
            return;
        }

        gpsSuccess(pos);
    }, intervalMs);
}

function stopPollingSensors(){
    if (sensorPollId) {
        clearInterval(sensorPollId);
        sensorPollId = null;
    }
    if (geoWatchId != null && navigator.geolocation) {
        navigator.geolocation.clearWatch(geoWatchId);
        geoWatchId = null;
    }
}

function gpsSuccess(position){

    //----------------------------------------
    // GPS values
    //----------------------------------------

    let speed = position.coords.speed;
    let heading = position.coords.heading;

    if(speed==null || isNaN(speed)) speed=0;
    if(heading==null || isNaN(heading)) heading=0;

    //----------------------------------------
    // MASTER VOLUME (speed -> gain)
    //----------------------------------------
    //
    // 0 m/s -> silent
    // 3 m/s -> full volume
    //

    let volume = speed/3;
    volume = Math.max(0, Math.min(1, volume));

    masterGain.gain.linearRampToValueAtTime(
        volume,
        audioContext.currentTime + 0.2
    );

    //----------------------------------------
    // TIMBRE (heading/course -> mix)
    //----------------------------------------
    //
    // Requirement:
    //   Due North (0°) -> full sine (squareAmount = 0)
    //   Due South (180°) -> full square (squareAmount = 1)
    // Mapping used: a triangular mapping with peak at 180°
    //   squareAmount = 1 - |(h - 180)| / 180
    // This yields:
    //   0° -> 0, 90° -> 0.5, 180° -> 1, 270° -> 0.5, 360° -> 0
    //

    // Normalize heading to [0,360)
    let h = ((heading % 360) + 360) % 360;

    let squareAmount = 1 - Math.abs((h - 180) / 180);
    squareAmount = Math.max(0, Math.min(1, squareAmount));

    let sineAmount = 1 - squareAmount;

    sineGain.gain.linearRampToValueAtTime(
        sineAmount,
        audioContext.currentTime + 0.2
    );

    squareGain.gain.linearRampToValueAtTime(
        squareAmount,
        audioContext.currentTime + 0.2
    );

    //----------------------------------------
    // Display
    //----------------------------------------

    status.textContent=
`Latitude : ${position.coords.latitude}

Longitude: ${position.coords.longitude}

Speed    : ${speed.toFixed(2)} m/s

Heading  : ${h.toFixed(1)}°

Volume   : ${volume.toFixed(2)}

Sine     : ${sineAmount.toFixed(2)}

Square   : ${squareAmount.toFixed(2)}
`;

}

function gpsError(err){

    status.textContent=
        "GPS Error\n\n"+(err && err.message ? err.message : String(err));

}

</script>

</body>
</html>
