<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directions</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column; /* stack vertically so hint is above the column */
        justify-content: center;
        align-items: center;
        background: white;
        font-family: Arial, sans-serif;
        gap: 50px; /* vertical spacing between hint and column */
        padding: 20px;
    }

    #wordColumn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px; /* Vertical spacing between lines */
        width: 100%;
        max-width: 900px; /* keep lines readable on large screens */
    }

    .word {
        font-size: clamp(18px, 4vw, 24px); /* responsive font size */
        text-align: center;
        /* allow very long, unbroken strings to wrap on small screens */
        word-break: break-word;
        overflow-wrap: anywhere;
        max-width: 100%;
    }

    /* keep the hint visually distinct if needed */
    #unscrambled-hint {
        line-height: 1.1;
        max-width: 100%;
    }
</style>
</head>
<body>

<div id="wordColumn"></div>

<script>
const words = [
    "South on Krumrey St",
    "East on Suhrke Rd",
    "North on State 67",
    "East on County J",
    "W4391",
    "Roots"
];

const container = document.getElementById("wordColumn");

words.forEach(text => {

    // Remove whitespaces
    text = text.replace(/\s+/g, "");
    
    // Scramble the letters of this word
    let chars = text.split("");

    for (let i = chars.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [chars[i], chars[j]] = [chars[j], chars[i]];
    }

    const scrambled = chars.join("");

    const div = document.createElement("div");
    div.className = "word";
    div.textContent = scrambled;
    container.appendChild(div);
});
</script>

</body>
</html>
