<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Challenge</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: #f4f0e6;
        color: #2d2418;
        font-family: "Cinzel", Georgia, serif;
        display: flex;
        flex-direction: column;
    }

    .riddle-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
    }

    .riddle {
        max-width: 800px;
        text-align: center;
        font-size: 1.4rem;
        line-height: 1.8;
        letter-spacing: 0.05em;
    }

    .puzzle-area {
        flex: 2;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-bottom: 60px;
    }

    .puzzle-box {
        width: min(800px, 90%);
    }

    .question-row {
        display: flex;
        align-items: center;
        margin: 12px 0;
        gap: 12px;
    }

    .question-label {
        flex: 1;
        text-align: left;
        font-size: 1rem;
    }

    .digit-input {
        width: 42px;
        height: 42px;
        text-align: center;
        font-size: 1.3rem;
        font-family: inherit;
        border: 2px solid #6b5b3e;
        border-radius: 4px;
        background: #fffdf8;
        transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    /* Visual feedback for correct/incorrect answers */
    .digit-input.correct {
        border-color: #6aa84f; /* muted green to match the site's warm palette */
        box-shadow: 0 0 0 4px rgba(106,168,79,0.12);
        background: #f6fff2;
    }

    .digit-input.incorrect {
        border-color: #c94a4a; /* warm muted red */
        box-shadow: 0 0 0 4px rgba(201,74,74,0.08);
        background: #fff6f6;
    }

    .submit-row {
        text-align: center;
        margin-top: 30px;
    }

    button {
        font-family: inherit;
        font-size: 1rem;
        padding: 10px 28px;
        cursor: pointer;
        border: 2px solid #6b5b3e;
        background: #d8ccb1;
        color: #2d2418;
        border-radius: 5px;
    }

    button:hover {
        background: #cbbd9d;
    }

    .error {
        text-align: center;
        margin-top: 15px;
        color: #8b0000;
        min-height: 1.5em;
    }
</style>
</head>
<body>

<div id="team-tracker-target"></div>
<script src="/treasurehunt/tracker.js"></script>
    
<div class="riddle-container">
    <div class="riddle">
       A painting of lotions and potions, Might possibly give you a notion. Go stand by the wall, And linger enthralled, While counting with careful devotion.
    </div>
</div>

<div class="puzzle-area">
    <div class="puzzle-box">

        <div class="question-row">
            <div class="question-label">Removeable Columns</div>
            <input class="digit-input" id="a1" maxlength="1">
        </div>

        <div class="question-row">
            <div class="question-label">Removabel Rows</div>
            <input class="digit-input" id="a2" maxlength="1">
        </div>

        <div class="question-row">
            <div class="question-label">Tired Horses</div>
            <input class="digit-input" id="a3" maxlength="1">
        </div>

        <div class="question-row">
            <div class="question-label">Castor Oils</div>
            <input class="digit-input" id="a4" maxlength="1">
        </div>

        <div class="question-row">
            <div class="question-label">Spectacles</div>
            <input class="digit-input" id="a5" maxlength="1">
        </div>

        <div class="question-row">
            <div class="question-label">Portal Knobs</div>
            <input class="digit-input" id="a6" maxlength="1">
        </div>

        <div class="submit-row">
            <button onclick="checkAnswers()">Submit</button>
        </div>

        <div class="error" id="errorMessage"></div>

    </div>
</div>

<script>
function checkAnswers() {

    const answers = [
        "5",
        "4",
        "2",
        "6",
        "4",
        "1"
    ];

    const inputs = [
        document.getElementById("a1"),
        document.getElementById("a2"),
        document.getElementById("a3"),
        document.getElementById("a4"),
        document.getElementById("a5"),
        document.getElementById("a6")
    ];

    const entered = inputs.map(i => (i.value || '').trim());

    const correctFlags = answers.map((value, index) => value === entered[index]);

    const allCorrect = correctFlags.every(Boolean);

    if (allCorrect) {
        // If all correct, go to next page
        window.location.href = "http://replicatorkid.github.io/treasurehunt/mural/1_pharmacy.html";
        return;
    }

    // Not all correct: provide per-input visual feedback
    inputs.forEach((input, idx) => {
        input.classList.remove('correct', 'incorrect');
        if (correctFlags[idx]) {
            input.classList.add('correct');
        } else {
            input.classList.add('incorrect');
        }
    });

    document.getElementById("errorMessage").textContent =
            "The numbers do not appear to be correct.";
}

// Allow only digits
document.querySelectorAll('.digit-input').forEach(box => {
    box.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
        // Remove previous state when user changes the value so feedback updates next submit
        this.classList.remove('correct', 'incorrect');
        document.getElementById('errorMessage').textContent = '';
    });
});
</script>

</body>
</html>
