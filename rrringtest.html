<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Progress Tracker</title>
</head>
<body>

    <!-- Simple inputs based on your scenario -->
    <h2>Welcome</h2>
    <label for="nameInput">Enter your name:</label>
    <input type="text" id="nameInput" placeholder="Your Name">
    <button id="startButton">Start</button>

    <script>
        document.getElementById('startButton').addEventListener('click', function() {
            const nameField = document.getElementById('nameInput').value.trim();
            
            // Basic validation check
            if (!nameField) {
                alert('Please enter a name first!');
                return;
            }

            // 1. Package the data neatly
            const payload = {
                name: nameField,
                page: window.location.href, // Automatically captures current URL
                time: new Date().toLocaleTimeString() // Captures local timestamp
            };

            // 2. Put your public Cloudflare Worker URL here
            const cloudflareWorkerUrl = "https://swinging-frogs-rrrin.nickandsarah2018.workers.dev/";

            // 3. Fire the request over to Cloudflare
            fetch(cloudflareWorkerUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    console.log("Progress logged successfully!");
                    // You can redirect them or change the page state here
                } else {
                    console.error("Failed to log progress.");
                }
            })
            .catch(error => {
                console.error("Network error encountered:", error);
            });
        });
    </script>
</body>
</html>
